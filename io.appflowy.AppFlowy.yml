app-id: io.appflowy.AppFlowy
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
command: AppFlowy
separate-locales: false
finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --socket=pulseaudio
  - --share=network
  - --device=all
  - --filesystem=home
  - --system-talk-name=org.freedesktop.NetworkManager.*
  - --own-name=io.appflowy.appflowy

modules:
  - name: keybinder3
    buildsystem: autotools
    post-install:
      - install -Dm644 COPYING /app/share/licenses/keybinder-3/COPYING
    sources:
      - type: archive
        url: https://github.com/kupferlauncher/keybinder/releases/download/keybinder-3.0-v0.3.2/keybinder-3.0-0.3.2.tar.gz
        sha256: e6e3de4e1f3b201814a956ab8f16dfc8a262db1937ff1eee4d855365398c6020

  - name: libnotify
    buildsystem: meson
    config-opts:
      - -Dtests=false
      - -Dintrospection=disabled
      - -Dman=false
      - -Dgtk_doc=false
      - -Ddocbook_docs=disabled
    sources:
      - type: archive
        url: https://download.gnome.org/sources/libnotify/0.8/libnotify-0.8.8.tar.xz
        sha256: 23420ef619dc2cb5aebad613f4823a2fa41c07e5a1d05628d40f6ec4b35bfddd
        x-checker-data:
          type: anitya
          project-id: 13149
          url-template: https://download.gnome.org/sources/libnotify/$major.$minor/libnotify-$version.tar.xz

  # AppFlowy 0.12.2 links against libbz2.so.1.0 (Debian-style soname), which is
  # not provided by the org.freedesktop.Platform runtime. Bundle it so the app
  # can start. See https://github.com/AppFlowy-IO/AppFlowy/issues/8793
  - name: bzip2
    buildsystem: simple
    build-commands:
      - make -f Makefile-libbz2_so
      - install -Dm755 libbz2.so.1.0.8 /app/lib/libbz2.so.1.0.8
      - ln -s libbz2.so.1.0.8 /app/lib/libbz2.so.1.0
      - ln -s libbz2.so.1.0 /app/lib/libbz2.so.1
    cleanup:
      - /bin
      - /include
      - /lib/pkgconfig
      - '*.a'
    sources:
      - type: archive
        url: https://sourceware.org/pub/bzip2/bzip2-1.0.8.tar.gz
        sha256: ab5a03176ee106d3f0fa90e381da478ddae405918153cca248e682cd0c4a2269
        x-checker-data:
          type: anitya
          project-id: 237

  # AppFlowy 0.14.3 changed the way its Linux tarball is assembled: the new
  # bundler ships a "host-libraries.regex" deny list and stopped shipping every
  # library matched by it. That list assumes Debian/Ubuntu sonames (the release
  # is built on ubuntu-22.04) and includes libjpeg.so.8, libbsd.so.0 and
  # libmd.so.0, so those files are now absent from lib/ although the 0.14.2
  # tarball still contained them.
  #
  # org.freedesktop.Platform ships libjpeg.so.62 -- a different soname -- and no
  # libbsd/libmd at all, so the app aborts with
  # "error while loading shared libraries: libjpeg.so.8".
  #
  # Remaining unresolved sonames in the 0.14.3 bundle:
  #   libjpeg.so.8 <- lib/libmpv.so.1
  #   libbsd.so.0  <- lib/libzmq.so.5, lib/libsndio.so.7
  #   libmd.so.0   <- libbsd.so.0
  #
  # Fixes https://github.com/flathub/io.appflowy.AppFlowy/issues/227
  # Fixes https://github.com/flathub/io.appflowy.AppFlowy/issues/228
  - name: libmd
    buildsystem: autotools
    config-opts:
      - --disable-static
    cleanup:
      - /include
      - /lib/pkgconfig
      - /share/man
      - '*.la'
    sources:
      - type: archive
        url: https://archive.hadrons.org/software/libmd/libmd-1.2.0.tar.xz
        sha256: ac15ffb8430502fbaccdec66c5a82ee0eab0b0f36220df56710feadfeb13d0a0
        x-checker-data:
          type: anitya
          project-id: 15525
          url-template: https://archive.hadrons.org/software/libmd/libmd-$version.tar.xz

  - name: libbsd
    buildsystem: autotools
    config-opts:
      - --disable-static
    cleanup:
      - /include
      - /lib/pkgconfig
      - /share/man
      - '*.a'
      - '*.la'
    sources:
      - type: archive
        url: https://libbsd.freedesktop.org/releases/libbsd-0.12.2.tar.xz
        sha256: b88cc9163d0c652aaf39a99991d974ddba1c3a9711db8f1b5838af2a14731014
        x-checker-data:
          type: anitya
          project-id: 1567
          url-template: https://libbsd.freedesktop.org/releases/libbsd-$version.tar.xz

  # Built with the libjpeg v8 API/ABI (WITH_JPEG8) so it installs the
  # libjpeg.so.8 soname that the bundled libmpv.so.1 was linked against. This is
  # the same ABI Ubuntu's libjpeg-turbo8 package provides. The runtime's own
  # libjpeg.so.62 uses a different soname and is left untouched.
  - name: libjpeg-turbo
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DCMAKE_INSTALL_LIBDIR=lib
      - -DENABLE_STATIC=OFF
      - -DWITH_JPEG8=1
      - -DWITH_TURBOJPEG=OFF
    cleanup:
      - /bin
      - /include
      - /lib/cmake
      - /lib/pkgconfig
      - /share/man
      - /share/doc
      - '*.a'
    sources:
      - type: archive
        url: https://github.com/libjpeg-turbo/libjpeg-turbo/releases/download/3.2.0/libjpeg-turbo-3.2.0.tar.gz
        sha256: 6f30092cef9fb839779646608f4ee14ae3cbac989c47fa05e841b0841f09878e
        x-checker-data:
          type: anitya
          project-id: 1648
          url-template: https://github.com/libjpeg-turbo/libjpeg-turbo/releases/download/$version/libjpeg-turbo-$version.tar.gz

  - name: appflowy
    buildsystem: simple
    build-commands:
      # Install the icon.
      - install -Dm644 logo.svg /app/share/icons/hicolor/scalable/apps/io.appflowy.AppFlowy.svg
      # # Install the AppStream metadata file.
      - install -Dm644 io.appflowy.AppFlowy.appdata.xml /app/share/appdata/io.appflowy.AppFlowy.appdata.xml
      # Install the desktop file.
      - install -Dm644 io.appflowy.AppFlowy.desktop /app/share/applications/io.appflowy.AppFlowy.desktop
      - cp -r appflowy/AppFlowy /app/appflowy
      - chmod +x /app/appflowy/AppFlowy
      - ln -s /app/appflowy/AppFlowy /app/bin/AppFlowy
    sources:
      - type: archive
        url: https://github.com/AppFlowy-IO/AppFlowy/releases/download/0.14.3/AppFlowy-0.14.3-linux-x86_64.tar.gz
        sha256: 92c77841e65aa823eef6b4d9525006a88236fc0ca9be680782ecabe37f3baf40
        x-checker-data:
          type: anitya
          project-id: 309593
          url-template: https://github.com/AppFlowy-IO/AppFlowy/releases/download/$version/AppFlowy-$version-linux-x86_64.tar.gz
        dest: appflowy/AppFlowy
      - type: file
        path: io.appflowy.AppFlowy.desktop
      - type: file
        path: io.appflowy.AppFlowy.appdata.xml
      - type: file
        path: logo.svg
